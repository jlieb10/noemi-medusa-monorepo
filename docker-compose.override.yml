# Docker Compose override for development
# This file is automatically loaded by docker-compose and provides
# development-specific configurations

services:
  # Override for faster development iteration
  medusa-backend:
    volumes:
      - ./noemi-medusa-backend:/app
      - /app/node_modules
      - backend_cache:/app/.medusa
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
    restart: unless-stopped

  medusa-storefront:
    volumes:
      - ./noemi-medusa-storefront:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped

  # Development-friendly configurations for third-party services
  strapi:
    environment:
      - NODE_ENV=development
      - STRAPI_DISABLE_UPDATE_NOTIFICATION=true
    restart: unless-stopped

  meilisearch:
    environment:
      - MEILI_ENV=development
    restart: unless-stopped

  posthog:
    environment:
      - DEBUG=1
    restart: unless-stopped

  n8n:
    environment:
      - N8N_LOG_LEVEL=debug
    restart: unless-stopped

volumes:
  backend_cache: