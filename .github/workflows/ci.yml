name: NOEMI Platform CI/CD

on:
  push:
    branches: [main, staging, copilot/**]
  pull_request:
    branches: [main, staging]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Check TypeScript compilation
        run: |
          npm run typecheck --workspace=noemi-medusa-backend --if-present
          npm run typecheck --workspace=noemi-medusa-storefront --if-present
        
      - name: Build backend
        run: npm run build --workspace=noemi-medusa-backend
        
      - name: Build frontend
        run: npm run build --workspace=noemi-medusa-storefront
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_test_placeholder
          
      - name: Run backend tests
        run: npm run test:unit --workspace=noemi-medusa-backend --if-present
        
      # Note: Frontend linting temporarily disabled due to ESLint config issues
      # - name: Lint frontend
      #   run: npm run lint --workspace=noemi-medusa-storefront
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            noemi-medusa-backend/dist/
            noemi-medusa-storefront/.next/
          retention-days: 7
          
  security-audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run security audit
        run: npm audit --audit-level=high
        continue-on-error: true
        
      - name: Run dependency check
        run: |
          echo "Checking for known vulnerabilities..."
          npm audit --json > audit-results.json || true
          
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit
          path: audit-results.json
          retention-days: 30

